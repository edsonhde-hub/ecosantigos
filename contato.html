<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contato · Ecos Antigos</title>
  <meta name="description" content="Fale com o Ecos Antigos.">
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="cabecalho">
    <a class="marca" href="index.html">Ecos Antigos</a>
    <nav>
      <a href="index.html#textos">Textos</a>
      <a href="sobre.html">Sobre</a>
      <a href="contato.html">Contato</a>
    </nav>
  </header>

  <main class="principal">
    <article class="texto">
      <h1>Contato</h1>

      <p>Quer comentar um texto, sugerir uma passagem ou só conversar? Escreva abaixo. Nome e e-mail são opcionais, e o e-mail só é necessário se você quiser resposta.</p>

      <form class="formulario" name="contato" method="POST" data-netlify="true" data-netlify-honeypot="campo-robo">
        <input type="hidden" name="form-name" value="contato">
        <p class="oculto"><label>Não preencha este campo: <input name="campo-robo"></label></p>
        <p>
          <label for="nome">Nome (opcional)</label>
          <input type="text" id="nome" name="nome" autocomplete="off">
        </p>
        <p>
          <label for="email">E-mail (opcional, se quiser resposta)</label>
          <input type="email" id="email" name="email" autocomplete="off">
        </p>
        <p>
          <label for="mensagem">Mensagem</label>
          <textarea id="mensagem" name="mensagem" rows="7" required></textarea>
        </p>
        <p><button type="submit">Enviar</button></p>
      </form>
    </article>

    <a class="voltar" href="index.html">Voltar para o início</a>
  </main>

  <footer class="rodape">
    <p>Ecos Antigos</p>
  </footer>
</body>
</html>
